name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Typecheck, tests, lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint

  android:
    name: Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: npm run build
      - run: node scripts/build-server.mjs
      - name: Install Android native packaging tools
        run: sudo apt-get update && sudo apt-get install -y binutils libarchive-tools patchelf
      - name: Install pinned Android NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865"
      - name: Install pinned Rust toolchain
        run: |
          if ! command -v rustup >/dev/null; then curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.99.1; fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install 1.99.1 --profile minimal --target aarch64-linux-android
      - run: python3 android/prepare.py
      - run: android/gradlew -p android assembleDebug lintDebug
      - name: Verify package identity and native payload
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test "$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "$apk")" = "ai.learnharness.android"
          python3 android/verify_apk.py --application-id ai.learnharness.android "$apk"
          python3 -m unittest android.tests.test_verify_apk

  standalone:
    name: Standalone (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Standard macos-15 runners are Apple Silicon (not macos-15-intel).
          - os: macos-15
            platform: mac-arm64
          - os: windows-2025
            platform: windows-x64
          - os: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Native renderer tests on this OS
        run: npx electron --import tsx --test tests/pdf-native-render.test.ts tests/pdf-ops.test.ts tests/svg-native-render.test.ts tests/browser-service.test.ts
        env:
          NODE_ENV: test
          ELECTRON_RUN_AS_NODE: "1"
      - run: npm run build
      # Check the fresh trace before any static copying/curation.
      - run: node scripts/smoke-provider-runtime.mjs
      - run: node scripts/build-server.mjs
      - run: node scripts/smoke-server.mjs --electron
